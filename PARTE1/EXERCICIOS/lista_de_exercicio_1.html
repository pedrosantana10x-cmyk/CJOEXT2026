<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 1</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="TituloPartes">
            <h2 class="TextoPartes">Parte I<br>Compreendendo Os Conceitos</h2>
        </div>
    </header>
    <main>
        <div class="Pergunta">
            <h2>Explique com suas próprias palavras o que significa acessibilidade digital.</h2>
        </div>
        <div class="ContainerResposta">
            <input placeholder="Digite aqui..."
            class="RespostaInput EscritaLisa"
            type="text"
            />
            <label class="LabelResposta">Sua Resposta</label>
        </div>
        <br>
        <div class="BotaoEnviar">
            <button id="enviarResposta1" onclick="location.href = 'lista_de_exercicio_2.html';">Enviar</button>
        </div>
    </main>
    <footer>

    </footer>
    <!--Js adicionado por Pedro Ferreira -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
    const inputResposta = document.querySelector('.RespostaInput');
    const botaoEnviar = document.getElementById('enviarResposta1');

    const CHAVE_STORAGE = 'resposta_questao_1';

    const respostaSalva = localStorage.getItem(CHAVE_STORAGE);
    if (respostaSalva) {
        inputResposta.value = respostaSalva;
    }

    function salvarResposta() {
        const texto = inputResposta.value.trim();
        if (texto !== '') {
            localStorage.setItem(CHAVE_STORAGE, texto);
        }
    }
    inputResposta.addEventListener('input', () => {
        localStorage.setItem(CHAVE_STORAGE, inputResposta.value);
    });
    botaoEnviar.addEventListener('click', (event) => {
        salvarResposta();
    });
});
    </script>
</body>
</html>
