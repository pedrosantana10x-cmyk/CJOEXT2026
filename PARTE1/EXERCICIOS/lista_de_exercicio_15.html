<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 15</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="TituloPartes">
            <h2 class="TextoPartes">Reflexão Final</h2>
        </div>
    </header>
    <main>



        <div class="Pergunta">
            <h2>Após participar das palestras e realizar os exercícios, o que você aprendeu sobre acessibilidade digital? Como você acredita que a tecnologia pode ser utilizada para promover mais inclusão?</h2>
        </div>

        <div class="ContainerResposta">
            <input id="respostaInupt" placeholder="Digite aqui..."
            class="RespostaInput EscritaLisa"
            type="text"
            />
            <label class="LabelResposta">Sua Resposta</label>
        </div>
        <br>



        <div class="BotaoEnviar">
            <button id="enviarResposta1" onclick="location.href = 'resultado.html';">Enviar</button>
        </div>



    </main>
    <footer>

    </footer>
    <!--JS adicionado por Pedro Ferreira-->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const botaoEnviar = document.getElementById("enviarResposta1");
    const inputResposta = document.getElementById("respostaInput");
    const respostaSalva = localStorage.getItem("resposta_questao_15");
    if (respostaSalva) {
        inputResposta.value = respostaSalva;
    }

    botaoEnviar.addEventListener("click", () => {
        const textoResposta = inputResposta.value.trim();

        if (textoResposta === "") {
            alert("Por favor, digite uma resposta antes de enviar!");
            return;
        }

        localStorage.setItem("resposta_questao_15", textoResposta);
    });
});
    </script>
</body>
</html>
