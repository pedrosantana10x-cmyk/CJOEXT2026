<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 12</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="TituloPartes">
            <h2 class="TextoPartes">Parte IV<br>Observação e Análise</h2>
        </div>
    </header>
    <main>



        <div class="Pergunta">
            <h2>1) Acesse um site de sua escolha e identifique os seguintes atributos:<br>
            a) Nome do site.<br>
            b) Um recurso de acessibilidade encontrado. <br>
            c) Uma melhoria que poderia ser implementada.</h2>
        </div>

        <div class="ContainerResposta">
            <input placeholder="Digite aqui..."
            class="RespostaInput EscritaLisa"
            type="text"
            />
            <label class="LabelResposta">Sua Resposta</label>
        </div>
        <br>

        <div class="ContainerResposta">
            <input placeholder="Digite aqui..."
            class="RespostaInput EscritaLisa"
            type="text"
            />
            <label class="LabelResposta">Sua Resposta</label>
        </div>
        <br>

        <div class="ContainerResposta">
            <input placeholder="Digite aqui..."
            class="RespostaInput EscritaLisa"
            type="text"
            />
            <label class="LabelResposta">Sua Resposta</label>
        </div>
        <br>



        <div class="BotaoEnviar">
            <button id="enviarResposta1" onclick="location.href = 'lista_de_exercicio_13.html';">Enviar</button>
        </div>



    </main>
    <footer>

    </footer>
    <!--JS adicionado por Pedro Ferreira-->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const inputNomeSite = document.getElementById("nomeSite");
    const inputAcessibilidade = document.getElementById("recursoAcessibilidade");
    const inputMelhoria = document.getElementById("melhoria");
    const btnEnviar = document.getElementById("enviarResposta1");

    const carregarRespostas = () => {
        const respostasSalvas = localStorage.getItem("respostas_questao12");
        if (respostasSalvas) {
            const dados = JSON.parse(respostasSalvas);
            if (inputNomeSite) inputNomeSite.value = dados.nomeSite || "";
            if (inputAcessibilidade) inputAcessibilidade.value = dados.recursoAcessibilidade || "";
            if (inputMelhoria) inputMelhoria.value = dados.melhoria || "";
        }
    };

    const salvarRespostas = () => {
        const dadosRespostas = {
            nomeSite: inputNomeSite ? inputNomeSite.value : "",
            recursoAcessibilidade: inputAcessibilidade ? inputAcessibilidade.value : "",
            melhoria: inputMelhoria ? inputMelhoria.value : "",
            dataEnvio: new Date().toISOString()
        };

        localStorage.setItem("respostas_questao12", JSON.stringify(dadosRespostas));
    };

    carregarRespostas();

    [inputNomeSite, inputAcessibilidade, inputMelhoria].forEach(input => {
        if (input) {
            input.addEventListener("input", salvarRespostas);
        }
    });

    if (btnEnviar) {
        btnEnviar.addEventListener("click", (e) => {
            e.preventDefault();
            salvarRespostas();
        });
    }
});
    </script>
</body>
</html>
