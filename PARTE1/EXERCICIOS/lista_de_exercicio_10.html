<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 10</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="TituloPartes">
            <h2 class="TextoPartes">Parte III<br>Acessibilidade No Desenvolvimento Web</h2>
        </div>
    </header>
    <main>



        <div class="Pergunta">
            <h2>3) O atributo alt é utilizado para:<br>
            (A) Alterar as cores de uma imagem.<br>
            (B) Reduzir o tamanho do arquivo. <br>
            (C) Fornecer uma descrição para tecnologias assistivas.<br>
            (D) Adicionar animações.</h2>
        </div>

        <div class="ContainerResposta">
            <input placeholder="Digite aqui..."
            class="RespostaInput EscritaLisa"
            type="text"
            />
            <label class="LabelResposta">Sua Resposta</label>
        </div>
        <br>



        <div class="BotaoEnviar">
            <button id="enviarResposta1" onclick="location.href = 'lista_de_exercicio_11.html';">Enviar</button>
        </div>



    </main>
    <footer>

    </footer>
    <!-- Js aplicado por pedro Ferreira -->
    <script> 
    document.addEventListener("DOMContentLoaded", () => {
    const inputResposta = document.getElementById("respostaQuestao3");
    const btnEnviar = document.getElementById("enviarResposta1");
    const CHAVE_STORAGE = "resposta_questao_3";

    const respostaSalva = localStorage.getItem(CHAVE_STORAGE);
    if (respostaSalva) {
        inputResposta.value = respostaSalva;
    }

    btnEnviar.addEventListener("click", () => {
        const respostaDigitada = inputResposta.value.trim();

        if (respostaDigitada === "") {
            alert("Por favor, digite uma resposta antes de enviar.");
            return;
        }
        localStorage.setItem(CHAVE_STORAGE, respostaDigitada);
    });
});
    </script>
</body>
</html>
