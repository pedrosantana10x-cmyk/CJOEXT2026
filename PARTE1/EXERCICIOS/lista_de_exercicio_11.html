<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 11</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="TituloPartes">
            <h2 class="TextoPartes">Parte III<br>Acessibilidade No Desenvolvimento Web</h2>
        </div>
    </header>
    <main>



        <div class="Pergunta">
            <h2>4) Qual recurso auxilia usuários da comunidade surda que utilizam Libras?<br>
            (A) CSS.<br>
            (B) JavaScript. <br>
            (C) VLibras.<br>
            (D) Banco de dados.</h2>
        </div>

        <div class="ContainerResposta">
            <input placeholder="Digite aqui..."
            class="RespostaInput EscritaLisa"
            type="text"
            />
            <label class="LabelResposta">Sua Resposta</label>
        </div>
        <br>



        <div class="BotaoEnviar">
            <button id="enviarResposta1" onclick="location.href = 'lista_de_exercicio_12.html';">Enviar</button>
        </div>



    </main>
    <footer>

    </footer>
    <!--JS adicionado por Pedro Ferreira --> 
    <script>
        document.addEventListener('DOMContentLoaded', () => {
    const inputResposta = document.querySelector('.RespostaInput');
    const botaoEnviar = document.getElementById('enviarResposta1');

    const CHAVE_STORAGE = 'resposta_questao_11';
    const respostaSalva = localStorage.getItem(CHAVE_STORAGE);
    if (respostaSalva) {
        inputResposta.value = respostaSalva;
    }

    botaoEnviar.addEventListener('click', (event) => {
        const valorDigitado = inputResposta.value.trim();

        if (valorDigitado === '') {
            event.preventDefault(); 
            alert('Por favor, digite uma resposta antes de enviar!');
            return;
        }

        localStorage.setItem(CHAVE_STORAGE, valorDigitado);
    });
});
    </script>
</body>
</html>
