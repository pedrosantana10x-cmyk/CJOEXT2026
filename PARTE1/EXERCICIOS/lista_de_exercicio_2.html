<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 2</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="TituloPartes">
            <h2 class="TextoPartes">Parte I<br>Compreendendo Os Conceitos</h2>
        </div>
    </header>
    <main>
        <div class="Pergunta">
            <h2>Cite três exemplos de barreiras digitais que podem dificultar o acesso de determinados usuários.</h2>
        </div>
        <div class="ContainerResposta">
            <input placeholder="Digite aqui..."
            class="RespostaInput EscritaLisa"
            type="text"
            />
            <label class="LabelResposta">Sua Resposta</label>
        </div>
        <br>
        <div class="BotaoEnviar">
            <button id="enviarResposta1" onclick="location.href = 'lista_de_exercicio_3.html';">Enviar</button>
        </div>
    </main>
    <footer>

    </footer>
    <!--JS adicionado por Pedro Ferreira-->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const inputResposta = document.querySelector(".RespostaInput");
    const botaoEnviar = document.getElementById("enviarResposta1");
    const CHAVE_STORAGE = "resposta_questao_2";
    const respostaSalva = localStorage.getItem(CHAVE_STORAGE);
    if (respostaSalva) {
        inputResposta.value = respostaSalva;
    }

    botaoEnviar.addEventListener("click", (e) => {
        e.preventDefault();

        const textoResposta = inputResposta.value.trim();

        if (textoResposta === "") {
            alert("Por favor, digite uma resposta antes de enviar!");
            return;
        }

        localStorage.setItem(CHAVE_STORAGE, textoResposta);
    });
});
    </script>
</body>
</html>
